# Cloud Run service — DEV environment (containerized JVM, front-end dev/testing).
#
# Declarative Knative Service applied with:  gcloud run services replace service.dev.yaml --region <REGION>
# This is the single source of truth for the dev service's configuration, and both deploy paths
# apply this same file after substituting the image placeholder below with the built image
# (written without the literal token, which a naive substitution would rewrite here too):
#   - cloudbuild.yaml  — on every push, via the Cloud Build trigger (the normal path)
#   - deploy/deploy.ps1 — from a developer machine, when you need to deploy out of band
# Anything set outside this file (console edits, `gcloud run services update --flags`) is wiped
# by the next deploy, which is the point: a revision's config is whatever git says it is.
#
# Fill in the REPLACE_* placeholders before the first deploy:
#   - REPLACE_NEON_DEV_DIRECT_HOST : the DIRECT (non-pooled) endpoint host of your Neon *dev* branch
#                                    (no "-pooler" in the hostname — Flyway's migration lock needs a real session).
#
# Secrets (DATABASE_PASSWORD, JWT_SECRET) are pulled from Secret Manager — create them once,
# see docs/overview/environments.md. Firebase needs no secret: tokens are verified against public keys.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  # Must match the live Cloud Run service — `services replace` addresses the service by name,
  # and a mismatch silently creates a second service on a different URL.
  name: myapis
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"   # scale to zero when idle (dev cost saver)
        autoscaling.knative.dev/maxScale: "4"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 40
      timeoutSeconds: 300
      containers:
        - image: __IMAGE__
          ports:
            - name: http1
              containerPort: 8080   # Cloud Run injects PORT=8080; the app reads PORT.
          env:
            - name: APP_ENV
              value: "dev"
            # DIRECT (non-pooled) Neon *dev* branch endpoint; sslmode=require.
            - name: DATABASE_URL
              value: "jdbc:postgresql://ep-quiet-smoke-azyguapi.c-3.ap-southeast-1.aws.neon.tech:5432/neondb"
            - name: DATABASE_USER
              value: "neondb_owner"
            - name: DATABASE_POOL_SIZE
              value: "5"
            - name: JWT_ISSUER
              value: "dental-pms"
            - name: JWT_AUDIENCE
              value: "dental-pms-web"
            - name: ACCESS_TOKEN_TTL_MINUTES
              value: "15"
            - name: REFRESH_TOKEN_TTL_DAYS
              value: "14"
            # Front-end dev origin(s), comma-separated host[:port] (no scheme). Required in prod; set here too.
            - name: CORS_ALLOWED_HOSTS
              value: "localhost:8083, 127.0.0.1:8083"
            # ---- Firebase Authentication ---------------------------------------------
            # ID tokens are verified against Google's public JWKS, so this project id is the only
            # Firebase setting needed — there is no service-account key to mount or rotate.
            # Without it the app boots with Firebase DISABLED (a warn log, not a startup failure)
            # and no staff member can sign in — only the LOCAL break-glass account.
            - name: FIREBASE_PROJECT_ID
              value: "gen-lang-client-0189875791"
            # Claim policy applied to every staff ID token, on top of the signature / issuer /
            # audience / expiry checks. Shown explicitly (not left to the defaults) so the controls
            # in force are visible in the manifest.
            - name: FIREBASE_REQUIRE_VERIFIED_EMAIL
              value: "true"
            # Comma-separated `firebase.sign_in_provider` allowlist. Staff use the "Sign in with
            # Google" button, so the flow produces `google.com`.
            - name: FIREBASE_ALLOWED_SIGN_IN_PROVIDERS
              value: "google.com"
            # Max age of the token's `auth_time` — how long a sign-in stays good before the user
            # must authenticate again. NOT the ID token lifetime (the client SDK refreshes that
            # hourly without re-authenticating). 0 disables. Ship 0 until the front-end handles the
            # 401 → sign-out → sign-in path, then raise it; see docs/api-contracts/auth.md.
            - name: FIREBASE_MAX_SESSION_AGE_HOURS
              value: "12"
            # ---- Secrets from Secret Manager (create once; see docs/environments.md) ----
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dental-pms-dev-db-password
                  key: latest
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dental-pms-dev-jwt-secret
                  key: latest
            # ---- First-run bootstrap (OPTIONAL) --------------------------------------
            # Seeds the initial accounts only while app_user is empty (idempotent). Wire these
            # as secrets for the FIRST deploy, then remove them and redeploy. See docs/environments.md.
            # - name: BOOTSTRAP_SYSADMIN_EMAIL
            #   valueFrom: { secretKeyRef: { name: dental-pms-dev-bootstrap-sysadmin-email, key: latest } }
            # - name: BOOTSTRAP_SYSADMIN_PASSWORD
            #   valueFrom: { secretKeyRef: { name: dental-pms-dev-bootstrap-sysadmin-password, key: latest } }
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 30   # up to ~90s: covers JVM warmup + Neon cold-wake from autosuspend
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 3
