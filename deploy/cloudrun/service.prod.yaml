# Cloud Run service — PROD environment (live deployment).
#
# Declarative Knative Service applied with:  gcloud run services replace service.prod.yaml --region <REGION>
# deploy/deploy.ps1 substitutes the __IMAGE__ placeholder with the freshly built+pushed image.
#
# Fill in the REPLACE_* placeholders before the first deploy:
#   - REPLACE_NEON_PROD_DIRECT_HOST : the DIRECT (non-pooled) endpoint host of your Neon *prod* branch
#                                     (no "-pooler" in the hostname — Flyway's migration lock needs a real session).
#   - REPLACE_FE_PROD_ORIGIN        : your production front-end origin as host[:port] (no scheme), e.g. app.example.com
#   - REPLACE_FIREBASE_PROD_PROJECT_ID : the Firebase project whose ID tokens this environment accepts
#
# Secrets (DATABASE_PASSWORD, JWT_SECRET) are pulled from Secret Manager — create them once,
# see docs/environments.md. Firebase needs no secret: tokens are verified against public keys.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: dental-pms-prod
  annotations:
    run.googleapis.com/ingress: all   # tighten to internal-and-cloud-load-balancing if you front it with an HTTPS LB.
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"   # keep 1 warm instance — avoids JVM + Neon cold starts on prod traffic.
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 60
      timeoutSeconds: 300
      containers:
        - image: __IMAGE__
          ports:
            - name: http1
              containerPort: 8080   # Cloud Run injects PORT=8080; the app reads PORT.
          env:
            - name: APP_ENV
              value: "prod"
            # DIRECT (non-pooled) Neon *prod* branch endpoint; sslmode=require.
            - name: DATABASE_URL
              value: "jdbc:postgresql://REPLACE_NEON_PROD_DIRECT_HOST/dental_pms?sslmode=require"
            - name: DATABASE_USER
              value: "neondb_owner"
            - name: DATABASE_POOL_SIZE
              value: "10"
            - name: JWT_ISSUER
              value: "dental-pms"
            - name: JWT_AUDIENCE
              value: "dental-pms-web"
            - name: ACCESS_TOKEN_TTL_MINUTES
              value: "15"
            - name: REFRESH_TOKEN_TTL_DAYS
              value: "14"
            # Production front-end origin(s), comma-separated host[:port] (no scheme). MANDATORY in prod
            # (the app refuses to start with APP_ENV=prod and an unset CORS_ALLOWED_HOSTS).
            - name: CORS_ALLOWED_HOSTS
              value: "REPLACE_FE_PROD_ORIGIN"
            # ---- Firebase Authentication ---------------------------------------------
            # ID tokens are verified against Google's public JWKS, so this project id is the only
            # Firebase setting needed — there is no service-account key to mount or rotate.
            # Without it the app boots with Firebase DISABLED (a warn log, NOT a startup failure —
            # the break-glass path must survive a Firebase outage) and no staff member can sign in.
            # In prod that is an outage: set it, and check the startup log says
            # "Firebase Authentication enabled for project ...".
            - name: FIREBASE_PROJECT_ID
              value: "REPLACE_FIREBASE_PROD_PROJECT_ID"
            # Claim policy applied to every staff ID token, on top of the signature / issuer /
            # audience / expiry checks. Keep these strict in prod.
            - name: FIREBASE_REQUIRE_VERIFIED_EMAIL
              value: "true"
            # Comma-separated `firebase.sign_in_provider` allowlist. Staff use the "Sign in with
            # Google" button, so the flow produces `google.com`. Adding a provider here is a
            # security decision — anything listed can authenticate to the clinical API.
            - name: FIREBASE_ALLOWED_SIGN_IN_PROVIDERS
              value: "google.com"
            # Max age of the token's `auth_time` — how long a sign-in stays good before the user
            # must authenticate again. NOT the ID token lifetime (the client SDK refreshes that
            # hourly without re-authenticating). 0 disables. Do not enable this in the same release
            # that ships the front-end's 401 → sign-out → sign-in handling; see
            # docs/api-contracts/auth.md, or staff will loop on 401 after 12 hours.
            - name: FIREBASE_MAX_SESSION_AGE_HOURS
              value: "12"
            # ---- Secrets from Secret Manager (create once; see docs/environments.md) ----
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dental-pms-prod-db-password
                  key: latest
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dental-pms-prod-jwt-secret
                  key: latest
            # ---- First-run bootstrap (OPTIONAL) --------------------------------------
            # Seeds the initial accounts only while app_user is empty (idempotent). Wire these
            # as secrets for the FIRST deploy, then remove them and redeploy. See docs/environments.md.
            # - name: BOOTSTRAP_SYSADMIN_EMAIL
            #   valueFrom: { secretKeyRef: { name: dental-pms-prod-bootstrap-sysadmin-email, key: latest } }
            # - name: BOOTSTRAP_SYSADMIN_PASSWORD
            #   valueFrom: { secretKeyRef: { name: dental-pms-prod-bootstrap-sysadmin-password, key: latest } }
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 30   # up to ~90s: covers JVM warmup + Neon cold-wake from autosuspend
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 3
