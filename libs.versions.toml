[versions]
bcrypt = "0.10.2"
exposed = "1.3.0"
flyway = "11.8.2"
hikari = "6.3.0"
koin = "4.2.2"
kotest = "5.9.1"
kotlin = "2.4.0"
logback = "1.5.35"
mockk = "1.14.3"
postgresql = "42.7.11"
prometheus = "1.17.0"
smiley4 = "5.7.0"
schemaKenerator = "2.7.2"

[libraries]
bcrypt = { module = "at.favre.lib:bcrypt", version.ref = "bcrypt" }
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-javaTime = { module = "org.jetbrains.exposed:exposed-java-time", version.ref = "exposed" }
# Firebase ID tokens are verified as RS256 JWTs against Google's public JWKS — no Admin SDK, and so
# no service-account credentials. com.auth0:java-jwt and com.auth0:jwks-rsa come in transitively via
# Ktor's ktor-server-auth-jwt, which the app already uses for the LOCAL break-glass token.
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
koin-ktor = { module = "io.insert-koin:koin-ktor", version.ref = "koin" }
koin-loggerSlf4j = { module = "io.insert-koin:koin-logger-slf4j", version.ref = "koin" }
ktor-openapi = { module = "io.github.smiley4:ktor-openapi", version.ref = "smiley4" }
ktor-swaggerUi = { module = "io.github.smiley4:ktor-swagger-ui", version.ref = "smiley4" }
# schema-kenerator types leak into SchemaGenerator.kotlinx()'s signature but are only runtime-scoped
# in ktor-openapi's POM, so they must be on the compile classpath explicitly.
schemakenerator-core = { module = "io.github.smiley4:schema-kenerator-core", version.ref = "schemaKenerator" }
schemakenerator-swagger = { module = "io.github.smiley4:schema-kenerator-swagger", version.ref = "schemaKenerator" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
micrometer-registryPrometheus = { module = "io.micrometer:micrometer-registry-prometheus", version.ref = "prometheus" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }

# Test-only
kotest-assertionsCore = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-runnerJunit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
